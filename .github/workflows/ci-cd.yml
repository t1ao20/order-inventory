name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/order-service

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports

      - name: Run Docker test profile
        run: docker compose --profile test run --rm --build order-service-test

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/test-report.html
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            reports/coverage
            reports/coverage.xml
          if-no-files-found: ignore

      - name: Stop compose services
        if: always()
        run: docker compose --profile test down -v --remove-orphans

  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_PORT: ${{ secrets.EC2_PORT }}
      EC2_PROJECT_DIR: ${{ secrets.EC2_PROJECT_DIR }}

    steps:
      - name: Skip deploy when EC2 secrets are missing
        if: env.EC2_HOST == '' || env.EC2_USER == '' || env.EC2_SSH_KEY == '' || env.EC2_PROJECT_DIR == ''
        run: echo "EC2 deployment secrets are not configured. Build completed, deployment skipped."

      - name: Deploy with Docker Compose
        if: env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY != '' && env.EC2_PROJECT_DIR != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          script: |
            cd "${{ secrets.EC2_PROJECT_DIR }}"

            git fetch origin main
            git pull --ff-only origin main

            cat > .env << 'EOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            TEST_REPORT_DIR=${{ secrets.TEST_REPORT_DIR }}
            LOGIN_SERVICE_URL=${{ secrets.LOGIN_SERVICE_URL }}
            NOTIFICATION_SERVICE_URL=${{ secrets.NOTIFICATION_SERVICE_URL }}
            MENU_SERVICE_URL=${{ secrets.MENU_SERVICE_URL }}
            ADMIN_USER_ID=${{ secrets.ADMIN_USER_ID }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF

            chmod 600 .env

            docker compose up -d --build order-service
            docker compose ps order-service
